<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Home Library{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="navbar">
    <div class="nav-inner">
        <a class="brand" href="{{ url_for('index') }}">Home Library</a>
        <nav>
            <a href="{{ url_for('index') }}">Library</a>
            <a href="{{ url_for('about') }}">About</a>
            <a href="{{ url_for('contact') }}">Contact</a>
        </nav>
        <a class="nav-button" href="{{ url_for('new_book') }}">+ Add Book</a>
    </div>
</header>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="container flash-wrap">
    {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
</div>
{% endif %}
{% endwith %}

{% block content %}{% endblock %}

<footer>
    <p>Home Library Management System · 2026</p>
</footer>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
